name: SNS daily post

on:
  schedule:
    - cron: "7 10 * * *"   # 毎日 19:07 JST（GitHub の混雑で数分〜遅れることがあります）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず内容だけ確認"
        type: boolean
        default: false

permissions:
  contents: write   # queue.yaml の投稿結果をコミットするため

concurrency:
  group: sns-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sns-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m sns_auto post ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save queue state
        if: always() && !inputs.dry_run
        working-directory: .
        run: |
          git config user.name "sns-bot"
          git config user.email "sns-bot@users.noreply.github.com"
          git add sns-automation/queue.yaml
          git diff --cached --quiet || (git commit -m "chore(sns): update post queue [skip ci]" && git push)
